name: is_shapes
description: >-
  What an intersyntactic shape file uses to mark the fields a node is about,
  and to name a node, point at it in any pass, say who wrote it, and take it
  back.
version: 0.1.0
repository: https://github.com/intersyntactic/shapes

environment:
  sdk: ^3.13.0

dependencies:
  # A git dependency, pinned by commit, until is_content_id is published;
  # then ^0.1.0.
  is_content_id:
    git:
      url: git@github.com:intersyntactic/content_id.git
      ref: c878d99949ce2fb17d25cf5091d6f025f80d2eac

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
